[package]
name = "runwell-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Linux host execution, systemd, cgroup v2, and PSI integration for runwell."

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tokio.workspace = true
secrecy.workspace = true
tracing.workspace = true
jiff.workspace = true
futures-util = "=0.3.34"
runwell-config = { version = "=0.1.0", path = "../runwell-config" }
runwell-admission = { version = "=0.1.0", path = "../runwell-admission" }
runwell-store = { version = "=0.1.0", path = "../runwell-store" }
runwell-runner = { version = "=0.1.0", path = "../runwell-runner" }
runwell-scaleset = { version = "=0.1.0", path = "../runwell-scaleset" }

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
zbus_systemd.workspace = true
rustix.workspace = true

[dev-dependencies]
wiremock = "=0.6.5"
tempfile = "=3.27.0"
serde_json.workspace = true
base64 = "=0.22.1"
