# Standalone Linux node configuration. Templates and state require a local disk.
# Budgets exclude OS/daemon headroom. No credentials are stored in this file.
schema_version = 1

[controller]
database = "/var/lib/runwell/runwell.sqlite"

[[controller.classes]]
name = "runwell-small"
cpu_slots = 1
memory_high_bytes = 2147483648
memory_max_bytes = 3221225472
cpu_weight = 100

[[controller.classes]]
name = "runwell-large"
cpu_slots = 4
memory_high_bytes = 8589934592
memory_max_bytes = 10737418240
cpu_weight = 200

[node]
id = "node-1"
state_dir = "/var/lib/runwell"
cpu_slots = 8
memory_bytes = 17179869184

[node.psi]
pause_percent = 10.0
resume_percent = 5.0

[github]
config_url = "https://github.com/example-org"

[github.auth]
kind = "app"
app_id = 1
installation_id = 1
private_key_file = "/run/credentials/runwell/github-app.pem"
# Alternative: kind = "pat" with token_file instead of App fields.

[transport]
ca_file = "/etc/runwell/tls/ca.pem"
certificate_file = "/etc/runwell/tls/identity.pem"
private_key_file = "/run/credentials/runwell/tls-key.pem"

# Run with: runwell node --config runwell.toml --standalone
# Create this dedicated account first; keep it out of the docker group.
[standalone]
max_jobs = 8
runner_user = "runwell-runner"
templates_dir = "/var/lib/runwell/templates"
runners_dir = "/var/lib/runwell/runners"
drain_seconds = 3600
stop_seconds = 120
idle_seconds = 180
reconcile_seconds = 5
runner_group_id = 1

[standalone.overcommit]
cpu = 1.0
memory = 1.0

[standalone.ci]
cpu_weight = 100
memory_max_bytes = 19327352832

[standalone.runner]
version = "2.337.0"
# sha256 = "<64 hex digits>" # Otherwise verified against release notes; fail closed.
# Updates: warn after 21 days, refresh at 25, refuse stale templates at 30.
# Alternatively use github.auth kind = "pat_env", token_env = "RUNWELL_GITHUB_TOKEN".
