[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["The runwell contributors"]

[workspace.dependencies]
tokio = { version = "=1.53.2", features = ["full"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream", "http2"] }
axum = "=0.8.9"
hyper = { version = "=1.11.1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
url = "=2.5.8"
futures-util = "=0.3.34"
tempfile = "=3.27.0"
jsonwebtoken = { version = "=11.1.0", features = ["aws_lc_rs"] }
hmac = "=0.13.0"
sha2 = "=0.11.0"
secrecy = "=0.10.3"
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
zbus_systemd = { version = "=0.26200.0", features = ["systemd1", "zbus-async-tokio"] }
bollard = "=0.21.1"
rustix = { version = "=1.1.5", features = ["mount", "fs", "process"] }
reflink-copy = "=0.1.30"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
prometheus-client = "=0.25.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
tracing-journald = "=0.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.6"
humantime-serde = "=1.1.0"
bytesize = { version = "=2.7.0", features = ["serde"] }
sd-notify = "=0.5.0"
backon = "=1.6.0"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
uuid = { version = "=1.26.0", features = ["v4"] }
jiff = { version = "=0.2.37", features = ["serde"] }
dialoguer = { version = "=0.12.0", default-features = false }
dirs = "=6.0.0"
yaml-rust2 = { version = "=0.13.0", default-features = false }
similar = "=2.7.0"
proptest = "=1.11.0"
wiremock = "=0.6.5"
fastrand = "=2.5.0"
httpdate = "=1.0.3"
regex = "=1.13.1"

rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
x509-parser = "=0.18.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
